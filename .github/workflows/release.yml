name: Build and attach add-on zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .ankiaddon
        run: zip -X show-answer-button-pressed.ankiaddon __init__.py config.json config.md

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" show-answer-button-pressed.ankiaddon
